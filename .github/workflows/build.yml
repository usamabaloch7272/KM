name: Build My Job KM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q MyJobKM_Full_v2.zip -d project
          echo "===== Project structure ====="
          find project -maxdepth 3 -type f | head -30

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Everything
        working-directory: project
        run: |
          # 1. Enable AndroidX + suppress JVM target error
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kotlin.jvm.target.validation.mode=WARNING" >> gradle.properties

          # 2. Fix missing AlertDialog import
          MAIN_FILE=$(find . -name "MainActivity.kt" | head -1)
          
          if [ -n "$MAIN_FILE" ]; then
            echo "Found MainActivity at: $MAIN_FILE"
            
            # Add import if missing
            if ! grep -q "import.*AlertDialog" "$MAIN_FILE"; then
              sed -i '1a import androidx.appcompat.app.AlertDialog' "$MAIN_FILE"
              echo "Added AlertDialog import"
            fi
            
            echo "===== First 25 lines of MainActivity.kt ====="
            head -25 "$MAIN_FILE"
          else
            echo "WARNING: MainActivity.kt not found"
          fi

          echo "===== gradle.properties ====="
          cat gradle.properties

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyJobKM-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
