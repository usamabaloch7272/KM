name: Build My Job KM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q MyJobKM_Full_v2.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Project Settings
        working-directory: project
        run: |
          # Enable AndroidX
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # Fix JVM target inconsistency (force Java 17)
          if [ -f app/build.gradle ]; then
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle || true
            sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle || true
            sed -i 's/"1.8"/"17"/g' app/build.gradle || true
            sed -i "s/'1.8'/'17'/g" app/build.gradle || true
          fi
          
          echo "===== gradle.properties ====="
          cat gradle.properties
          echo "===== app/build.gradle (first 50 lines) ====="
          head -50 app/build.gradle || true

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyJobKM-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
